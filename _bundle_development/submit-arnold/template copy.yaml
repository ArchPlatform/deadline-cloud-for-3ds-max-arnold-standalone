specificationVersion: jobtemplate-2023-09
name: 3DSMaxArnoldTest
description: null
parameterDefinitions:
- name: ArnoldStandaloneInstallDirectory
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Arnold Standalone Install Location (Linux)
    groupLabel: Arnold Standalone Installation
  description: Directory where Arnld standalone is installed on render nodes
- name: MaxVersion
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Max Version (Year)
    groupLabel: Arnold Standalone Installation
  description: Version of 3DSMax that generated scene file
- name: ArnoldSceneFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Arnold Scene File
    groupLabel: Arnold Settings
    fileFilters:
    - label: Arnold Scene Files
      patterns:
      - '*.ass'
    - label: All Files
      patterns:
      - '*'
  description: The Arnold scene file to render.
- name: Frames
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Frames
    groupLabel: Arnold Settings
  description: The frames to render. E.g. 1-3,8,11-15
  minLength: 1
- name: OutputFilePath
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output File Path
    groupLabel: Arnold Settings
  description: The render output path.
- name: OutputFileName
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Output File Name
    groupLabel: Arnold Settings
  description: The output file name (including extension)
  default: image_###.png
- name: ImageWidth
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Image Width
    groupLabel: Arnold Settings
  minValue: 1
  description: The image width of the output.
- name: ImageHeight
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Image Height
    groupLabel: Arnold Settings
  minValue: 1
  description: The image height of the output.
steps:
# - name: LucidWait
#   script:
#     actions:
#       onRun:
#         command: sleep
#         args:
#         - "7"
- name: State01
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: '{{Param.Frames}}'
  stepEnvironments:
  - name: Max/Arnold Pathmappings
    description: Sets up Max to Arnold Standalone path mappings
    # variables:
    #   ARNOLD_PATHMAP: '{{Env.File.arnoldPathmap}}'
    script:
      actions:
        onEnter:
          command: echo
          args:
          - ARNOLD_PATHMAP={{Env.File.arnoldPathmap}}
      embeddedFiles:
      - name: arnoldPathmap
        filename: arnoldPathmap.json
        type: TEXT
        data: |
          {
            "linux": {
              "C:/programdata/autodesk/applicationplugins/maxtoa_{{Param.MaxVersion}}/ocio": "{{Param.ArnoldStandaloneInstallDirectory}}/ocio",
              "c:/programdata/autodesk/applicationplugins/maxtoa_{{Param.MaxVersion}}/ocio": "{{Param.ArnoldStandaloneInstallDirectory}}/ocio",
              "C:/ProgramData/Autodesk/ApplicationPlugins/MAXtoA_{{Param.MaxVersion}}/ocio": "{{Param.ArnoldStandaloneInstallDirectory}}/ocio",
              "C:/Program Files/Autodesk/3ds Max {{Param.MaxVersion}}/OSL": "{{Param.ArnoldStandaloneInstallDirectory}}/osl"
            }
          }
  - name: Delayed Start
    script:
      actions:
        onEnter:
          command: sleep
          args:
          - "10"
  script:
    actions:
      onRun:
        command: "{{Param.ArnoldStandaloneInstallDirectory}}/bin/kick"
        args:
        - '-sl'
        - '-i {{Param.ArnoldSceneFile}}'
        - '-r {{Param.ImageWidth}} {{Param.ImageHeight}}'
        - '-o {{Param.OutputFilePath}}/{{Task.Param.Frame}}.{{Param.OutputFileName}}'
        - '-frame {{Task.Param.Frame}}'
        cancelation:
          mode: NOTIFY_THEN_TERMINATE